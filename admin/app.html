<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinterest SEO Product Engine</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {font-family:sans-serif;background:#f4f4f4;margin:0;}
header {background:#e60023;color:white;padding:15px;text-align:center;}
.container {padding:10px;}
input,select,button{
  width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;
}
button{background:#e60023;color:white;border:none;}
.card{background:white;padding:10px;margin-top:10px;border-radius:12px;}
img{width:100%;border-radius:10px;margin-top:5px;}
.tag{font-size:12px;color:green;}
</style>
</head>

<body>

<header>📌 Pinterest SEO Product Engine</header>

<div class="container">

<input id="query" placeholder="Search product">
<input id="suffix" placeholder="Suffix (optional)">

<select id="count">
<option>10</option><option>20</option><option>30</option>
<option>40</option><option>50</option>
</select>

<button onclick="searchProducts()">Generate SEO Pins</button>
<button onclick="downloadZip()">Download ZIP</button>

<div id="output"></div>

</div>

<script>

let store=[];

// -------- QUERY --------
function buildQuery(){
  let query=document.getElementById("query").value.trim();
  let suffix=document.getElementById("suffix").value.trim();

  if(!suffix) suffix="amazon product images";

  return `${query} ${suffix}`.trim();
}

// -------- SEARCH (DuckDuckGo primary) --------
async function searchDDG(q){
  try{
    let res=await fetch(`https://api.duckduckgo.com/?q=${q}&format=json`);
    let data=await res.json();

    let results=[];
    function extract(arr){
      arr.forEach(i=>{
        if(i.Text) results.push(i.Text);
        if(i.Topics) extract(i.Topics);
      });
    }

    extract(data.RelatedTopics||[]);
    return results;
  }catch{return [];}
}

// -------- RANK --------
function rank(list){

  let keywords=["best","buy","review","top","deal","price"];

  return [...new Set(list)]
    .map((t,i)=>{
      let score=0;

      keywords.forEach(k=>{
        if(t.toLowerCase().includes(k)) score+=5;
      });

      score += (100 - i);
      score += t.length/20;

      return {text:t,score};
    })
    .sort((a,b)=>b.score-a.score);
}

// -------- IMAGE --------
function getImages(q,n){
  let arr=[];
  for(let i=0;i<n;i++){
    arr.push(`https://source.unsplash.com/600x800/?${q}&sig=${Math.random()}`);
  }
  return arr;
}

// -------- SEO ENGINE --------

function generateSEO(title){

  let base = title.toLowerCase();

  let keywords = base.split(" ").slice(0,5).join(", ");

  let hashtags = [
    "#amazonfinds",
    "#pinterestfinds",
    "#trendingproducts",
    "#budgetshopping",
    "#musthave"
  ];

  let dynamicTags = base.split(" ").slice(0,3).map(w=>"#"+w);

  let caption = `🔥 ${title}
✨ Best ${base} you need right now!
💰 Affordable & trending in 2026
👉 Grab yours today!

${hashtags.join(" ")} ${dynamicTags.join(" ")}`;

  return caption;
}

// -------- MAIN --------

async function searchProducts(){

  store=[];
  let output=document.getElementById("output");

  output.innerHTML="⏳ Generating...";

  let q=buildQuery();
  let count=parseInt(document.getElementById("count").value);

  let results=await searchDDG(q);

  if(results.length===0){
    results=[...Array(count)].map((_,i)=>`Best ${q} product ${i+1}`);
  }

  let ranked=rank(results).slice(0,count);

  output.innerHTML=`<p class="tag">Source: DuckDuckGo</p>`;

  ranked.forEach(item=>{

    let imgs=getImages(item.text,3);
    let seoText=generateSEO(item.text);

    let safeName=item.text.replace(/\s+/g,"_").toLowerCase();

    store.push({title:item.text,images:imgs,text:seoText,name:safeName});

    let div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <h3>${item.text}</h3>
      ${imgs.map(i=>`<img src="${i}">`).join("")}
      <p>${seoText}</p>
    `;

    output.appendChild(div);

  });
}

// -------- ZIP --------

async function downloadZip(){

  if(store.length===0){
    alert("Generate first!");
    return;
  }

  let zip=new JSZip();

  for(let i=0;i<store.length;i++){

    let item=store[i];
    let folder=zip.folder(item.name);

    folder.file("pin.txt",item.text);

    for(let j=0;j<item.images.length;j++){
      try{
        let res=await fetch(item.images[j]);
        let blob=await res.blob();
        folder.file(`${item.name}_${j+1}.jpg`,blob);
      }catch{}
    }
  }

  let content=await zip.generateAsync({type:"blob"});
  let a=document.createElement("a");

  a.href=URL.createObjectURL(content);
  a.download="pinterest_seo_pack.zip";
  a.click();
}

</script>

</body>
</html>
