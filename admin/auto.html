<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Zone AI Stable</title>

<style>
body{font-family:sans-serif;background:#111;color:#fff;margin:0}
.container{max-width:900px;margin:auto;padding:10px}
.card{background:#1c1c1c;padding:12px;margin-bottom:12px;border-radius:12px}
input,button,select{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:none;font-size:16px}
button{background:#ff4081;color:#fff;font-weight:bold}
.row{display:flex;gap:10px;flex-wrap:wrap}
img{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>

<body>
<div class="container">

<h2>🚀 Delivery Zone AI (Stable Version)</h2>

<div class="card">
<input id="hfKey" placeholder="HuggingFace API Key (optional)">
</div>

<div class="card">
<select id="quality">
<option value="normal">Normal</option>
<option value="hd">HD</option>
</select>
</div>

<div class="card">
<input id="productInput" placeholder="Product">
<input id="countInput" type="number" value="2">
<button onclick="startAutomation()">Start Automation</button>
<button onclick="stopAutomation()">Stop</button>
</div>

<div class="card">
<input id="promptInput" placeholder="Prompt">
<button onclick="generateAIImage()">Generate Image</button>

<div id="imagePreview"></div>
</div>

<div class="card">
<button onclick="exportPins()">Export</button>
<button onclick="loadLibrary()">Library</button>
<div id="library" class="row"></div>
</div>

</div>

<script>

// PASSWORD
if(prompt("Password")!=="1234"){
 document.body.innerHTML="Access Denied";
 throw new Error();
}

// STORAGE
let pins = JSON.parse(localStorage.getItem("pins")||"[]");
function savePins(){localStorage.setItem("pins",JSON.stringify(pins));}

// WAIT
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

// MAIN IMAGE GENERATOR
async function generateAIImage(){

 let prompt = document.getElementById("promptInput").value;
 let quality = document.getElementById("quality").value;

 let finalPrompt = prompt + ", pinterest, aesthetic";
 if(quality==="hd") finalPrompt += ", ultra hd, 4k";

 console.log("Prompt:", finalPrompt);

 let url = await tryHuggingFace(finalPrompt);

 if(!url){
   url = tryPollinations(finalPrompt);
 }

 if(!url){
   url = generateFallbackImage(finalPrompt);
 }

 showImage(url);
}

// TRY HF
async function tryHuggingFace(prompt){

 let key = document.getElementById("hfKey").value;
 if(!key) return null;

 try{
  let res = await fetch(
   "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2",
   {
    method:"POST",
    headers:{
     Authorization:"Bearer "+key,
     "Content-Type":"application/json"
    },
    body: JSON.stringify({inputs:prompt})
   }
  );

  if(!res.ok) return null;

  let type = res.headers.get("content-type")||"";

  if(type.includes("json")) return null;

  let blob = await res.blob();
  return URL.createObjectURL(blob);

 }catch(e){
  console.log("HF fail");
  return null;
 }
}

// POLLINATIONS (NO FAIL)
function tryPollinations(prompt){
 try{
  return "https://image.pollinations.ai/prompt/"
   + encodeURIComponent(prompt)
   + "?width=512&height=768&seed=" + Math.random();
 }catch{
  return null;
 }
}

// FALLBACK
function generateFallbackImage(text){
 return "https://via.placeholder.com/512x768?text=" + encodeURIComponent(text);
}

// SHOW IMAGE (NO CANVAS)
function showImage(src){

 let container = document.getElementById("imagePreview");

 let img = document.createElement("img");
 img.src = src;

 container.prepend(img);

}

// AUTOMATION
let running=false;

async function startAutomation(){

 if(running) return;
 running=true;

 let product=document.getElementById("productInput").value;
 let count=parseInt(document.getElementById("countInput").value);

 for(let i=0;i<count;i++){

  if(!running) break;

  let variation = product + ", aesthetic " + i;
  document.getElementById("promptInput").value = variation;

  await generateAIImage();

  let lastImg = document.querySelector("#imagePreview img").src;

  pins.push({img:lastImg});
  savePins();

  await wait(3000);
 }

 running=false;
 alert("Done");
}

function stopAutomation(){running=false;}

// EXPORT
function exportPins(){
 pins.forEach((p,i)=>{
  let a=document.createElement("a");
  a.href=p.img;
  a.download="pin_"+i+".png";
  a.click();
 });
}

// LIBRARY
function loadLibrary(){
 let div=document.getElementById("library");
 div.innerHTML="";
 pins.forEach(p=>{
  let img=document.createElement("img");
  img.src=p.img;
  div.appendChild(img);
 });
}

</script>

</body>
</html>
